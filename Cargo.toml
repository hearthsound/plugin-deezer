[package]
name = "hearthsound-plugin-deezer"
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "A Hearthsound catalog plugin backed by the Deezer public API"
repository = "https://github.com/hearthsound/plugin-deezer"

[lib]
crate-type = ["cdylib"]

[dependencies]
hearthsound-plugin = { git = "https://github.com/hearthsound/plugin-sdk", tag = "v0.2.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
